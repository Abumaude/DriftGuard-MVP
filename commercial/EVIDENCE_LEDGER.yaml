# Rules:
# 1. Exact wording matters. Do not validate a vague concept and publish a stronger sentence.
# 2. One source may support only part of a compound claim.
# 3. Customer anecdotes do not become general performance claims.
# 4. Internal AI review does not count as independent corroboration.
# 5. If the evidence changes, change the public claim.

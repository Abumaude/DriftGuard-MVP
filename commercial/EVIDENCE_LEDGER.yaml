  # -------------------------------------------------------------- closed loop

  - claim_id: "CLAIM-015"
    product_id: "driftguard"
    exact_claim: >
      Submission worked and approval worked, both passed every test written for
      them, and the submitter had no way to learn what had been decided.
    claim_type: "customer"
    surfaces: ["readme"]
    evidence_tier: "VERIFY"
    evidence:
      - source_type: "customer-record"
        source_ref: "RULING_closed-loop-gate-v1, ratified 2026-08-22; origin recorded as a member's app in a factory chat"
        supports: "That the case occurred and prompted the ruling. It is a real incident, not an illustration."
        limitations: >
          Second-hand to this repo — recorded in the ruling rather than observed
          directly by whoever writes the README. The member is unnamed and has
          not been asked whether the case may be described publicly.
    derivation: null
    approved_wording: >
      Describe the pattern without identifying details, as the README does.
      Do not name the member, the app, or the organisation.
    prohibited_wording: >
      Any version naming the member or their product, or implying they endorsed
      this project. Also: "we have seen this many times" — one case is recorded.
    owner: "operator"
    last_verified: "2026-08-22"
    review_trigger: ["pre-publish"]
    notes: >
      Worth a consent check before the launch post. A repo whose constitution
      says testimonials need explicit permission should not describe somebody's
      failed build on its front page without asking, even anonymised.

